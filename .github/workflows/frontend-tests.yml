name: Frontend Tests

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Validate HTML
      run: |
        npm install -g html-validate
        html-validate "*.html"

    - name: Check for broken links in HTML
      run: |
        if grep -r "src=\"\"" *.html || grep -r "href=\"\"" *.html; then
          echo "Found empty src or href attributes"
          exit 1
        fi
        echo "No broken links found"

    - name: Validate JavaScript syntax
      run: |
        node -c js/main.js
        echo "JavaScript syntax is valid"

    - name: Check for console.log in production code
      run: |
        if grep -n "console.log" js/main.js | grep -v "catch"; then
          echo "Warning: Found console.log statements (non-error logging)"
        fi
        echo "Check complete"

    - name: Verify required assets exist
      run: |
        test -f css/styles.css && echo "✓ styles.css exists"
        test -f css/normalize.css && echo "✓ normalize.css exists"
        test -f js/main.js && echo "✓ main.js exists"
        test -f img/thud.mp3 && echo "✓ thud.mp3 exists"
        echo "All required assets found"

    - name: Check file sizes
      run: |
        find img -type f -size +50M -exec ls -lh {} \; | awk '{print "WARNING: Large file " $9 " (" $5 ")"}'
        echo "File size check complete"
