# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name sushrutvaidya.in www.sushrutvaidya.in;

    return 301 https://sushrutvaidya.in$request_uri;
}

# Redirect www to non-www (HTTPS)
server {
    listen 443 ssl;
    server_name www.sushrutvaidya.in;

    ssl_certificate /etc/letsencrypt/live/sushrutvaidya.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sushrutvaidya.in/privkey.pem;

    return 301 https://sushrutvaidya.in$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name sushrutvaidya.in;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/sushrutvaidya.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sushrutvaidya.in/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Frontend - serve static files
    location / {
        proxy_pass http://portfolio-frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API - proxy to backend container
    location /api/ {
        proxy_pass http://portfolio-backend:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent caching of API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # CORS headers (if needed)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
    }

    # Backend audio files
    location /audio/ {
        proxy_pass http://portfolio-backend:8081/audio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache audio files
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Health check endpoint
    location /actuator/health {
        proxy_pass http://portfolio-backend:8081/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
