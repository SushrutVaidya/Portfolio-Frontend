# DevQuest reverse proxy — terminates TLS, routes to frontend/backend containers
# Service names assume docker-compose: frontend → portfolio-frontend, backend → portfolio-backend

# ─── Port 80: ACME challenge + redirect everything else to HTTPS ───
server {
    listen 80;
    server_name sushrutvaidya.in www.sushrutvaidya.in;

    # Let's Encrypt ACME http-01 challenge — MUST be reachable on port 80
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://sushrutvaidya.in$request_uri;
    }
}

# ─── Port 443 (www) → redirect to apex ───
server {
    listen 443 ssl;
    http2 on;
    server_name www.sushrutvaidya.in;

    ssl_certificate /etc/letsencrypt/live/sushrutvaidya.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sushrutvaidya.in/privkey.pem;

    return 301 https://sushrutvaidya.in$request_uri;
}

# ─── Port 443 (apex) — main site ───
server {
    listen 443 ssl;
    http2 on;
    server_name sushrutvaidya.in;

    # ── TLS ──
    ssl_certificate /etc/letsencrypt/live/sushrutvaidya.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sushrutvaidya.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Compression ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff2;

    # ── Body size — allow 10MB photo uploads ──
    client_max_body_size 10M;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Backend API ──
    # NOTE: CORS headers are set by Spring (CorsConfig.java). Do NOT add them
    # here — duplicate Access-Control-Allow-Origin headers break browsers.
    location /api/ {
        proxy_pass http://portfolio-backend:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't cache API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── Backend-served media (bundled in the JAR) ──
    # /clips/*.mp4, /audio/*.mp3, /kitchen/*.jpg, /gamer/*.jpg, /social/*.jpg, /otaku/*.jpg
    location ~ ^/(clips|audio|kitchen|gamer|social|otaku)/ {
        proxy_pass http://portfolio-backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;       # stream large mp4s
        proxy_request_buffering off;

        # Aggressively cache — these are immutable build-time assets
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ── User-uploaded photos (volume-mounted in backend container) ──
    location /uploads/ {
        proxy_pass http://portfolio-backend:8081/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 1 day cache, but allow revalidation since users can re-upload
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── Health check passthrough ──
    location /actuator/health {
        proxy_pass http://portfolio-backend:8081/actuator/health;
        access_log off;
    }

    # ── Everything else → frontend ──
    location / {
        proxy_pass http://portfolio-frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
