# DevQuest reverse proxy — terminates TLS, routes to frontend/backend containers
# Service names assume docker-compose: frontend → portfolio-frontend, backend → portfolio-backend

# ─── Rate-limit zones (http-level state, shared across all server blocks) ───
# 10m of shared memory = ~160k unique IPs tracked. Cheap.
#
#   api    — general JSON endpoints. Real users browsing the site hit ~5-10
#            /api/* calls per page load, so 5r/s + burst 20 gives comfortable
#            headroom for a legit user while shutting down scrapers/bots.
#   upload — /api/user/{id}/photo. Each request is up to 10MB and hits disk +
#            Thumbnailator. Cap hard at 3 per minute per IP.
#   auth   — /api/user register. Prevents someone from mass-creating rows.
#
# All zones use $binary_remote_addr (4 bytes for IPv4, ~16 for IPv6).
limit_req_zone $binary_remote_addr zone=api:10m    rate=5r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;

# 429 (not the default 503) — semantically correct for rate-limited responses
# and browsers/monitors treat it as a soft failure, not an outage.
limit_req_status 429;

# ─── Port 80: ACME challenge + redirect everything else to HTTPS ───
server {
    listen 80;
    server_name sushrutvaidya.in www.sushrutvaidya.in;

    # Let's Encrypt ACME http-01 challenge — MUST be reachable on port 80
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://sushrutvaidya.in$request_uri;
    }
}

# ─── Port 443 (www) → redirect to apex ───
server {
    listen 443 ssl;
    # http2 on;
    server_name www.sushrutvaidya.in;

    ssl_certificate /etc/letsencrypt/live/sushrutvaidya.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sushrutvaidya.in/privkey.pem;

    return 301 https://sushrutvaidya.in$request_uri;
}

# ─── Port 443 (apex) — main site ───
server {
    listen 443 ssl;
    # http2 on;
    server_name sushrutvaidya.in;

    # ── TLS ──
    ssl_certificate /etc/letsencrypt/live/sushrutvaidya.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sushrutvaidya.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Compression ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff2;

    # ── Body size — allow 10MB photo uploads ──
    client_max_body_size 10M;

    # ── Security headers ──
    # NOTE: `add_header` in a child `location` REPLACES the parent's set
    # rather than appending. Every location below that adds its own
    # Cache-Control MUST also `include` this snippet, else security
    # headers silently disappear on that path.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Backend API ──
    # NOTE: CORS headers are set by Spring (CorsConfig.java). Do NOT add them
    # here — duplicate Access-Control-Allow-Origin headers break browsers.

    # Photo upload — most expensive endpoint (disk + image processing).
    # Tight limit. Must come BEFORE the general /api/ block (nginx picks
    # the longest-matching prefix, but ~ regex wins over prefix — safer to
    # use exact prefix ordering here).
    location ~ ^/api/user/[^/]+/photo$ {
        limit_req zone=upload burst=2 nodelay;
        proxy_pass http://portfolio-backend:8081$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream the upload
        client_max_body_size 10M;
    }

    # Register endpoint — throttle mass row creation
    location = /api/user {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://portfolio-backend:8081/api/user;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://portfolio-backend:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers — must re-include because this location has its
        # own add_header calls, which overrides the server-level set.
        include /etc/nginx/snippets/security-headers.conf;
        # Don't cache API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── Backend-served media (bundled in the JAR) ──
    # /clips/*.mp4, /audio/*.mp3, /kitchen/*.jpg, /gamer/*.jpg, /social/*.jpg, /otaku/*.jpg
    location ~ ^/(clips|audio|kitchen|gamer|social|otaku)/ {
        proxy_pass http://portfolio-backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;       # stream large mp4s
        proxy_request_buffering off;

        include /etc/nginx/snippets/security-headers.conf;
        # Aggressively cache — these are immutable build-time assets
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ── User-uploaded photos (volume-mounted in backend container) ──
    location /uploads/ {
        proxy_pass http://portfolio-backend:8081/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        include /etc/nginx/snippets/security-headers.conf;
        # 1 day cache, but allow revalidation since users can re-upload
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── Health check passthrough ──
    location /actuator/health {
        proxy_pass http://portfolio-backend:8081/actuator/health;
        access_log off;
    }

    # ── Everything else → frontend ──
    location / {
        proxy_pass http://portfolio-frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
