# DevQuest local end-to-end proxy — HTTP only, no TLS.
#
# Mirrors nginx-reverse-proxy.conf's routing and rate-limits so an end-
# to-end local test exercises the same request path as production. Skips
# the TLS server blocks (no Let's Encrypt cert available locally) and the
# HTTP→HTTPS redirect.
#
# Used only when the docker-compose.override.yml runs the `nginx-local`
# service on port 8888. Prod deploys ignore this file entirely.

# Rate-limit zones — identical to prod so we can exercise 429s locally.
limit_req_zone $binary_remote_addr zone=api:10m    rate=5r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    server_name _;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff2;

    client_max_body_size 10M;

    # Security headers — same rules as prod (child scopes must re-include).
    include /etc/nginx/snippets/security-headers.conf;

    # Photo upload — regex location wins over prefix, keep first.
    location ~ ^/api/user/[^/]+/photo$ {
        limit_req zone=upload burst=2 nodelay;
        proxy_pass http://portfolio-backend:8081$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_max_body_size 10M;
    }

    location = /api/user {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://portfolio-backend:8081/api/user;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://portfolio-backend:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Backend-served media (bundled in the JAR)
    location ~ ^/(clips|audio|kitchen|gamer|social|otaku)/ {
        proxy_pass http://portfolio-backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # User-uploaded photos
    location /uploads/ {
        proxy_pass http://portfolio-backend:8081/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /actuator/health {
        proxy_pass http://portfolio-backend:8081/actuator/health;
        access_log off;
    }

    # Everything else → frontend container
    location / {
        proxy_pass http://portfolio-frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
