# DevQuest security headers — included in every location that also sets
# its own `add_header` (nginx's add_header semantics REPLACE, not append,
# in a child scope). See nginx-reverse-proxy.conf comments.

add_header X-Frame-Options        "SAMEORIGIN"                       always;
add_header X-Content-Type-Options "nosniff"                          always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# CSP — allowed origins match what pages actually load:
#   googletagmanager.com / google-analytics.com — GA on index.html
#   fonts.cdnfonts.com / fonts.googleapis.com / fonts.gstatic.com — fonts
#   images.unsplash.com — kitchen polaroid photos on aboutme
#   *.steamstatic.com — Steam CDN (rotates between cdn., cdn.cloudflare.,
#                       shared.cloudflare., etc. — wildcard covers all)
# 'unsafe-inline' remains until inline <script>/<style> get build-time hashes.
add_header Content-Security-Policy "\
default-src 'self'; \
script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; \
style-src  'self' 'unsafe-inline' https://fonts.cdnfonts.com https://fonts.googleapis.com; \
font-src   'self' https://fonts.cdnfonts.com https://fonts.gstatic.com data:; \
img-src    'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com https://images.unsplash.com https://*.steamstatic.com; \
media-src  'self' blob:; \
connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; \
frame-ancestors 'self'; \
base-uri   'self'; \
form-action 'self'; \
object-src 'none'" always;
