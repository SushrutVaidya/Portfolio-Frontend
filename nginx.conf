server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Browsers request /favicon.ico by default regardless of link tags —
    # return 204 to keep it out of the 404 log noise. The real icon is
    # inlined as a data-URI in index.html's <link rel="icon">.
    location = /favicon.ico { access_log off; return 204; }

    # Backend-served static media proxy — mirrors prod nginx-reverse-proxy
    # behavior so the same relative URLs (`/clips/...`, `/audio/...`,
    # etc.) work on port 8080 direct as they do behind the prod TLS
    # proxy. Without this, only the nginx-local (:8888) path resolves
    # /clips/*, and content-referencing pages like captcha.html's meme
    # modal 404 in local dev.
    location ~ ^/(api|clips|audio|kitchen|gamer|social|otaku|uploads)/ {
        proxy_pass http://portfolio-backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1000;

    # Vite bundles are content-hashed (index-<hash>.js), so they can be cached
    # forever — a new build produces a new filename. This must come BEFORE the
    # generic extension rule below, since nginx picks the first matching regex
    # location.
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header in a child scope REPLACES the parent set rather than
        # appending, so security headers must be repeated here.
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # Cache static assets aggressively — invalidate via cache-busting URL
    # (e.g. ?v=timestamp) when needed. Applies to unhashed media under /img/,
    # /assets/ and /devquest/, which is why the max-age is 30d not 1y.
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|mp3|mp4|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # Even cache branches must re-set security headers (add_header in
        # a child scope replaces the parent's, doesn't append).
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # SPA-style fallback for missing routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Base security headers (see nginx-reverse-proxy.conf for the shared
    # rationale). These apply to top-level document requests only, because
    # the cached-asset location above overrides via its own add_header.
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP — origins listed match what the pages actually load:
    #   googletagmanager.com    — GA/gtag on DevQuest pages
    #   google-analytics.com    — GA collector beacons
    #   fonts.cdnfonts.com      — Pricedown font on DevQuest pages
    #   fonts.googleapis.com    — Archivo Black / Space Grotesk / Space Mono /
    #                             Silkscreen for the React app; Inter + Caveat
    #                             for DevQuest
    #   fonts.gstatic.com       — font files
    #   images.unsplash.com     — kitchen polaroid photos on aboutme
    #   *.steamstatic.com       — Steam game headers (rotates across
    #                             cdn., cdn.cloudflare., shared.cloudflare.,
    #                             etc. — wildcard covers all)
    #
    # localhost:8081 / 127.0.0.1:8081 were REMOVED: they were dev origins
    # shipped to production. The React app now reaches the backend same-origin
    # (Vite dev proxy locally, this server's /api location in prod), so the
    # exception is no longer needed anywhere.
    #
    # 'unsafe-inline' is still required on both script-src and style-src:
    #   script-src — 8 DevQuest pages carry inline <script> blocks
    #                (captcha, skip-demo, and the test/ pages). Dropping it
    #                would break them. Removable once DevQuest is migrated.
    #   style-src  — Motion animates by writing element.style, which CSP
    #                treats as inline styling. Without this every animation
    #                in the React app silently stops.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.cdnfonts.com https://fonts.googleapis.com; font-src 'self' https://fonts.cdnfonts.com https://fonts.gstatic.com data:; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com https://images.unsplash.com https://*.steamstatic.com; media-src 'self' blob:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
