    <!-- Inline SVG favicon — no separate binary. nginx returns 204 for
         /favicon.ico so the browser's default request isn't a 404. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23ffdc58' width='100' height='100'/%3E%3Crect fill='none' stroke='%232d2a24' stroke-width='8' width='100' height='100'/%3E%3Ctext x='50' y='70' text-anchor='middle' font-family='-apple-system,sans-serif' font-weight='900' font-size='54' fill='%232d2a24'%3ESV%3C/text%3E%3C/svg%3E"
    />

    <!-- Fonts. Vite has no next/font, so these load via <link>:
         Archivo Black = display, Space Grotesk = body, Space Mono = readouts,
         Silkscreen = pixel numerals and micro-labels. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
