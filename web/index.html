    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Sushrut Vaidya" />

    <!-- Inline SVG favicon in the site palette — no separate binary, and no
         extra request. nginx returns 204 for /favicon.ico so the browser's
         default probe isn't a 404. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%2312100e' width='100' height='100'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-family='Georgia,serif' font-size='62' fill='%23e4633a'%3ESV%3C/text%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="/img/meta.png" />

    <!-- Fonts. Vite has no next/font, so these load via <link>.
         Three faces, one job each:
           Instrument Serif — display, incl. italic for inline emphasis
           Inter            — body
           JetBrains Mono   — every readout, label and index
         The previous build also pulled Archivo Black, Space Grotesk and
         Space Mono; dropping the three unused families is ~120 kB of font
         payload removed from first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300..600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
