    <!-- Inline SVG favicon in the site palette — no separate binary, and no
         extra request. nginx returns 204 for /favicon.ico so the browser's
         default probe isn't a 404. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23f54e00' width='100' height='100' rx='20'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='54' fill='%23ffffff'%3ESV%3C/text%3E%3C/svg%3E"
    />

    <!-- Fonts are self-hosted and bundled via @fontsource (see main.tsx):
         Newsreader Variable (display serif + italic), Inter Variable (body),
         JetBrains Mono Variable (readouts/labels). No Google Fonts <link> —
         a render-blocking third-party request on first paint is a perf and
         privacy cost the guidelines warn against, and self-hosting removes it. -->
